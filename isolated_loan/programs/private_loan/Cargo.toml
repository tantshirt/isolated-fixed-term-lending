[package]
name = "private_loan"
version = "0.1.0"
description = "Lendspan private loan protocol on MagicBlock Private Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "private_loan"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Epic 8 gate-only instructions (probe, custody, record, tick). Off in the deployed
# program to keep it small; build with `anchor build -- --features gates` to rerun gates.
gates = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control"] }
loan-core = { path = "../../crates/loan-core" }
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-clock = "3.2.1"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
pyth-solana-receiver-sdk = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
