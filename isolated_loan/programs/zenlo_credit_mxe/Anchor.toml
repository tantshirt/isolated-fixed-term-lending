[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
zenlo_credit_mxe = "828JKMx1RDffwUtWAKQ7gwyFwWEBrxoWQ5UnnJ9Upreb"

[programs.devnet]
zenlo_credit_mxe = "828JKMx1RDffwUtWAKQ7gwyFwWEBrxoWQ5UnnJ9Upreb"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `arcium test` runs this against the Arcium localnet (Docker). Write the preloaded accounts first:
# `npm run test:integration` does both. Rust unit and LiteSVM tests: `cargo test`.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/zenlo_credit_mxe.ts"

[hooks]

[test.validator]
startup_wait = 10000

# Accounts whose owners are not deployed on the Arcium localnet (each file names its own pubkey);
# written by tests/fixtures/write-localnet-accounts.ts.
[[test.validator.account_dir]]
directory = "tests/fixtures/localnet"
