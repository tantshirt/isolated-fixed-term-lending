# Story 27.1: the Arcium MXE is its own Cargo workspace. arcium-anchor 0.15.0 pins
# anchor-lang = 1.0.2, and putting it in the parent workspace would downgrade anchor-lang (and
# blake3, sha2, ...) for every program there, changing the legacy builds. The parent workspace
# excludes this directory; the legacy and V2 programs keep their own Cargo.lock.
[workspace]
members = ["programs/*", "encrypted-ixs"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
