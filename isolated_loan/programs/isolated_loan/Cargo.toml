[package]
name = "isolated_loan"
version = "0.1.0"
description = "Isolated fixed-term USDC / wSOL loan"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "isolated_loan"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Accept any USDC/wSOL mint for Surfpool walkthroughs. Never deploy this build.
local-mints = ["loan-core/local-mints"]

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
pyth-solana-receiver-sdk = "2.0.0"
loan-core = { path = "../../crates/loan-core" }

[dev-dependencies]
litesvm = "0.10.0"
solana-account = "3.4.0"
solana-clock = "3.2.1"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
