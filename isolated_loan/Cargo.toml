[workspace]
members = [
    "programs/*",
    "crates/*"
]
# Story 27.1: the Arcium MXE is its own workspace (arcium-anchor pins anchor-lang = 1.0.2).
exclude = ["programs/zenlo_credit_mxe"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# private_loan is deployed and redeployed often; optimise it for size.
[profile.release.package.private_loan]
opt-level = "z"

[profile.release.package.isolated_loan_v2]
opt-level = "z"

[profile.release.package.private_loan_v2]
opt-level = "z"
