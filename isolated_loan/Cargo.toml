[workspace]
members = [
    "programs/*",
    "crates/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# private_loan is deployed and redeployed often; optimise it for size.
[profile.release.package.private_loan]
opt-level = "z"

[profile.release.package.isolated_loan_v2]
opt-level = "z"
